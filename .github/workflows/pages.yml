name: Build and deploy to GitHub Pages

# Builds the static site (npm run build:static) and publishes dist/ to GitHub Pages.
# Per-source fetch failures are logged in the per-source table, not fatal; the build
# step exits 1 only when zero sources returned items (then nothing is deployed and the
# previous site stays online). The first run's 404 on PREVIOUS_SNAPSHOT_URL is normal.

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**']
  schedule:
    - cron: '17 * * * *' # hourly, off the top-of-hour load peak
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:static
        env:
          PUBLIC_URL: https://sudish007.github.io/startup-radar
          PREVIOUS_SNAPSHOT_URL: https://sudish007.github.io/startup-radar/data/items.json
          GITHUB_TOKEN: ${{ github.token }} # raises the GitHub search limit for the github_new_repos signal (10 -> 30 req/min)
          PRODUCTHUNT_TOKEN: ${{ secrets.PRODUCTHUNT_TOKEN }}
          CRUNCHBASE_API_KEY: ${{ secrets.CRUNCHBASE_API_KEY }}
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true # ships .nojekyll (the action drops dotfiles by default)

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
